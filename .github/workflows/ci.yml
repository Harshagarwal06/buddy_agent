name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt --output-file /tmp/news-buddy-runtime.txt >/dev/null
          uvx --from pip-audit pip-audit -r /tmp/news-buddy-runtime.txt

      - name: Build and smoke-test installed wheel
        run: |
          uv build
          SMOKE_DIR="$(mktemp -d)"
          uv venv --python 3.11 "$SMOKE_DIR/venv"
          uv pip install --python "$SMOKE_DIR/venv/bin/python" dist/*.whl
          cd "$SMOKE_DIR"
          "$SMOKE_DIR/venv/bin/news-buddy" run --dry-run --verbose

  mcp-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: news_buddy_mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt --output-file /tmp/news-buddy-mcp-runtime.txt >/dev/null
          uvx --from pip-audit pip-audit -r /tmp/news-buddy-mcp-runtime.txt

      - name: Build Docker image
        run: docker build .
