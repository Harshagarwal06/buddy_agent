name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 00:17 IST, well after the daily digest backup window.
    - cron: "47 18 * * 0"

concurrency:
  group: openwiki-update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    # The retry budget below is 3 x 5m plus two 60s cooldowns (~17m); leave room
    # for checkout, Node setup, and the global npm install on top of it.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          # Keep the write-capable GITHUB_TOKEN out of .git/config: the OpenWiki
          # CLI and its transitive npm dependencies run against this checkout.
          # create-pull-request supplies its own token.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pinned OpenWiki toolchain
        run: npm install --global openwiki@0.2.4 mermaid@11.16.0 jsdom@29.1.1

      - name: Update the Code Brain
        run: |
          for attempt in 1 2 3; do
            echo "OpenWiki attempt ${attempt}/3"
            if timeout --signal=INT --kill-after=30s 5m \
              openwiki code --update --print; then
              exit 0
            else
              task_exit_code=$?
            fi

            if [ "$attempt" -eq 3 ]; then
              exit "$task_exit_code"
            fi

            # A timed-out attempt can be interrupted mid-write. Discard partial
            # output so the next attempt starts from a clean tree.
            git checkout -- openwiki
            git clean -fd openwiki

            echo "OpenWiki failed; cooling down for 60 seconds before retry."
            sleep 60
          done
        env:
          OPENWIKI_PROVIDER: nvidia
          OPENWIKI_MODEL_ID: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
          OPENWIKI_PROVIDER_RETRY_ATTEMPTS: "2"
          OPENWIKI_TELEMETRY_DISABLED: "1"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Validate generated documentation
        run: python3 scripts/validate_openwiki.py

      - name: Create reviewable documentation pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # Generated documentation only. AGENTS.md and CLAUDE.md are agent
          # instruction files and are deliberately excluded so an automated run
          # cannot rewrite the rules that future agents follow.
          add-paths: |
            openwiki
          branch: openwiki/update
          delete-branch: true
          draft: true
          commit-message: "docs: update OpenWiki Code Brain"
          title: "docs: update OpenWiki Code Brain"
          body: |
            Automated, documentation-only OpenWiki update.

            Review the generated claims against source, config, tests, and
            workflows before merging. This job does not run or deploy the
            digest and does not send notifications.
