# News Buddy — edit feeds and LLM settings to taste.

feeds:
  - name: OpenAI News
    url: https://openai.com/news/rss.xml
  - name: MIT Tech Review AI
    url: https://www.technologyreview.com/feed/
  - name: The Verge AI
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
  - name: VentureBeat AI
    url: https://venturebeat.com/category/ai/feed/
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
  - name: Ars Technica AI
    url: https://feeds.arstechnica.com/arstechnica/technology-lab
  - name: Google AI Blog
    url: https://blog.google/innovation-and-ai/technology/ai/rss/
  - name: NVIDIA Deep Learning Blog
    url: https://blogs.nvidia.com/blog/category/deep-learning/feed/
  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
  - name: Apple ML Research
    url: https://machinelearning.apple.com/rss.xml
  - name: Berkeley AI Research
    url: https://bair.berkeley.edu/blog/feed.xml
  - name: Hacker News AI
    url: https://hnrss.org/newest?q=AI
  - name: MarkTechPost
    url: https://www.marktechpost.com/feed/
  - name: Google News AI
    url: "https://news.google.com/rss/search?q=artificial+intelligence+when:1d&hl=en-US&gl=US&ceid=US:en"
  - name: Google News OpenAI
    url: "https://news.google.com/rss/search?q=OpenAI+OR+ChatGPT+when:1d&hl=en-US&gl=US&ceid=US:en"
  - name: Google News Anthropic
    url: "https://news.google.com/rss/search?q=Anthropic+OR+Claude+when:1d&hl=en-US&gl=US&ceid=US:en"
  - name: Google News Gemini
    url: "https://news.google.com/rss/search?q=Gemini+AI+OR+Google+DeepMind+when:1d&hl=en-US&gl=US&ceid=US:en"

# Feeds whose source/category is already AI-focused. Items from these feeds do
# not need to repeat an AI keyword in the title or RSS summary.
trusted_ai_sources:
  - OpenAI News
  - The Verge AI
  - VentureBeat AI
  - TechCrunch AI
  - Google AI Blog
  - NVIDIA Deep Learning Blog
  - Hugging Face Blog
  - Apple ML Research
  - Berkeley AI Research
  - Hacker News AI
  - MarkTechPost
  - Google News AI
  - Google News OpenAI
  - Google News Anthropic
  - Google News Gemini

# Only articles whose title or summary contain these keywords are kept.
# Case-insensitive. Add or remove words to tune what gets through.
ai_keywords:
  - artificial intelligence
  - machine learning
  - deep learning
  - large language model
  - llm
  - generative ai
  - openai
  - anthropic
  - google deepmind
  - mistral
  - gemini
  - gpt
  - claude
  - neural network
  - ai model
  - ai agent
  - foundation model

output_dir: ~/news
lookback_hours: 24
max_items_per_feed: 10
max_articles: 8          # hard cap on articles summarized per run (protects API quota)
min_articles: 8          # if fewer survive, widen the lookback until this target is met
max_backfill_lookback_hours: 168   # stop widening after 7 days
backfill_max_items_per_feed: 25    # inspect more RSS entries when topping up
icymi_backfill: true     # if still short, repeat recent seen feed items and label them ICYMI
max_top_stories: 5
summary_style: "concise, neutral, 2-3 sentences"

rubric:
  enabled: true
  min_summary_length: 60     # minimum chars for a "complete" summary
  importance_penalty: 2      # subtracted from importance when rubric fails
  retry_on_failure: true     # retry once with a stricter prompt on failure

images:
  enabled: true
  provider: nvidia
  model: black-forest-labs/flux.2-klein-4b
  width: 1184
  height: 880
  quality: 82
  max_workers: 1
  timeout: 180
  retries: 2
  retry_delay: 2
  steps: 4
  require_all: true
  require_article_brief: true
  style_guide: prompts/image_style.md
  style_version: explainer-v10
  generate_in_test_run: false

llm:
  provider: google           # "huggingface", "google" (Gemini API), or "ollama" (local)
  main_model: gemini-2.5-flash  # unused by the LangGraph pipeline (summaries only)
  sub_model: gemini-2.5-flash   # summarizer + article-specific image planner
  hf_provider: auto          # Hugging Face Inference Provider routing
  temperature: 0.2
  max_tokens: 512
  requests_per_minute: 8     # client-side throttle for hosted LLM APIs
  # For local Ollama instead, set provider: ollama and use:
  # base_url: http://localhost:11434
  # main_model: llama3.1:8b
  # sub_model: llama3.2:3b
