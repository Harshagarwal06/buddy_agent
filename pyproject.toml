[project]
name = "news-buddy"
version = "0.1.0"
description = "Daily AI news digest pipeline with LangGraph, RSS feeds, LLM summaries, and notifications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harsh Agarwal" }]
keywords = ["ai", "news", "digest", "langgraph", "rss", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.9",
    "langgraph>=1.2.11",
    "feedparser",
    "trafilatura",
    "httpx>=0.28.1",
    "lxml",
    "pillow",
    "pyyaml",
    "python-dotenv",
    "tenacity",
]

[project.optional-dependencies]
google = ["langchain-google-genai"]
huggingface = ["huggingface-hub"]
ollama = ["langchain-ollama"]
rag = ["chromadb", "langchain-google-genai"]
observability = [
    "arize-phoenix-otel",
    "openinference-instrumentation-langchain",
]
[project.urls]
Homepage = "https://harshagarwal06.github.io/buddy_agent/"
Repository = "https://github.com/Harshagarwal06/buddy_agent"
Issues = "https://github.com/Harshagarwal06/buddy_agent/issues"

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.15.22",
    "langchain-google-genai",
    "huggingface-hub",
    "langchain-ollama",
    "chromadb",
    "arize-phoenix-otel",
    "openinference-instrumentation-langchain",
]

[project.scripts]
news-buddy = "news_buddy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["news_buddy"]

[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "news_buddy/resources/config.yaml"
"prompts" = "news_buddy/resources/prompts"
"tokens.css" = "news_buddy/resources/tokens.css"
"favicon.svg" = "news_buddy/resources/favicon.svg"

[tool.pytest.ini_options]
testpaths = ["tests"]
